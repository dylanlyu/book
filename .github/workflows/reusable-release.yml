name: Reusable Release Workflow

on:
  workflow_call:
    inputs:
      tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      generate-notes:
        description: 'Auto-generate release notes'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release or republish (e.g., v2.0.0-rc.1)'
        required: true
        type: string
      generate-notes:
        description: 'Auto-generate release notes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      package_file: ${{ steps.pack.outputs.package_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run supply-chain IOC scan
        run: npm run security:ioc-scan

      - name: Verify OMP adapter payload
        run: node tests/omp/omp-plugin.test.js

      - name: Validate version tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag format. Expected vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi

      - name: Verify package version matches tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG_VERSION="${INPUT_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            echo "Run: ./scripts/release.sh $TAG_VERSION"
            exit 1
          fi

      - name: Verify release metadata stays in sync
        run: node tests/plugin-manifest.test.js

      - name: Generate release highlights
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          cat > release_body.md <<EOF
          ## ECC ${TAG_VERSION}

          ### What This Release Focuses On
          - Harness reliability and cross-platform compatibility
          - Eval-driven quality improvements
          - Better workflow and operator ergonomics

          ### Package Notes
          - Not published to the npm registry. Install the \`.tgz\` asset attached to this release:
            \`npm install ./ecc-universal-${TAG_VERSION}.tgz\`
          - Claude marketplace/plugin identifier: \`ecc@ecc\`
          EOF

      - name: Pack npm artifact
        id: pack
        run: |
          npm pack --json > npm-pack.json
          PACKAGE_FILE=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('npm-pack.json', 'utf8')); console.log(data[0].filename)")
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecc-release-artifacts
          path: |
            release_body.md
            ${{ steps.pack.outputs.package_file }}
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecc-release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release_body.md
          files: ${{ needs.verify.outputs.package_file }}
          fail_on_unmatched_files: true
          generate_release_notes: ${{ inputs.generate-notes }}
          prerelease: ${{ contains(inputs.tag, '-') }}
          make_latest: ${{ contains(inputs.tag, '-') && 'false' || 'true' }}
